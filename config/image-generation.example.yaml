schema_version: "0.1"

# Persistent, user-editable settings. The default provider is configurable;
# this template currently documents ChatGPT Image as the default workflow.
provider:
  default: chatgpt_image
  note: "Change this value when using another generator or manual assets."

prompt_profile:
  name: default-editorial
  common_prompt: |
    Create a refined visual for this website.
    Maintain a coherent visual theme across the site.
  style_prompt: |
    restrained editorial style, calm composition,
    controlled colors, subtle visual depth
  negative_prompt: |
    no readable text, no logos, no watermark,
    no recognizable brand

output:
  composition: square
  generated_master_format: png
  web_format: jpeg
  web_quality: 88
  direct_generated_output_for_web: false
