schema_version = "0.1"

[provider]
default = "chatgpt_image"
note = "Change this value when using another generator or manual assets."

[prompt_profile]
name = "default-editorial"
common_prompt = "Create a refined visual for this website.\nMaintain a coherent visual theme across the site.\n"
style_prompt = "restrained editorial style, calm composition,\ncontrolled colors, subtle visual depth\n"
negative_prompt = "no readable text, no logos, no watermark,\nno recognizable brand\n"

[output]
composition = "square"
generated_master_format = "png"
web_format = "jpeg"
web_quality = 88
direct_generated_output_for_web = false
